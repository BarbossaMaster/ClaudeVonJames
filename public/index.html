<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Jarvis</title>
<style>
  :root {
    --bg: #05080f; --panel: #0c1220; --line: #1b2740; --text: #e6edf7; --muted: #7f8ea8;
    --accent: #38bdf8; --accent-2: #818cf8; --warn: #fbbf24; --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: radial-gradient(120% 80% at 50% 0%, #0b1730 0%, var(--bg) 60%);
    color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; min-height: 100dvh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 6px; }
  header h1 { font-size: 15px; letter-spacing: .28em; text-transform: uppercase; margin: 0; font-weight: 600; color: var(--accent); }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; background: transparent; }
  button.pill { cursor: pointer; font: inherit; font-size: 12px; }
  button.pill[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 4px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; min-width: 0; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.alert b { color: var(--warn); }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; min-height: 300px; }
  .orb {
    --glow: var(--accent);
    width: min(56vw, 230px); aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer; position: relative;
    background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--glow) 55%, transparent) 0 18%, transparent 19%),
                radial-gradient(circle at 50% 50%, #0d1a33 0 100%);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--glow) 70%, transparent), 0 0 46px color-mix(in srgb, var(--glow) 35%, transparent), inset 0 0 40px color-mix(in srgb, var(--glow) 20%, transparent);
    transition: box-shadow .25s, transform .15s;
  }
  .orb:active { transform: scale(.97); }
  .orb::before, .orb::after {
    content: ""; position: absolute; inset: 12%; border-radius: 50%;
    border: 2px dashed color-mix(in srgb, var(--glow) 65%, transparent); animation: spin 18s linear infinite;
  }
  .orb::after { inset: 26%; border-style: solid; border-color: color-mix(in srgb, var(--glow) 40%, transparent) transparent; animation: spin 6s linear infinite reverse; }
  .orb[data-state="listening"] { --glow: #34d399; animation: pulse 1.1s ease-in-out infinite; }
  .orb[data-state="thinking"] { --glow: var(--accent-2); }
  .orb[data-state="thinking"]::after { animation-duration: 1.2s; }
  .orb[data-state="speaking"] { --glow: var(--accent); animation: pulse .7s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(1.045); } }
  @media (prefers-reduced-motion: reduce) { .orb, .orb::before, .orb::after { animation: none !important; } }

  #status { color: var(--muted); font-size: 14px; min-height: 1.4em; text-align: center; }
  #heard { font-size: 15px; color: var(--text); opacity: .85; min-height: 1.4em; text-align: center; max-width: 34ch; }

  #log { width: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; max-height: 32dvh; overflow-y: auto; padding: 4px 0; }
  .msg { padding: 9px 12px; border-radius: 14px; max-width: 86%; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
  .msg.me { align-self: flex-end; background: #16233d; }
  .msg.jarvis { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }

  form { display: flex; gap: 8px; width: 100%; max-width: 640px; margin: 10px auto 14px; }
  input[type=text], input[type=password] {
    flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 12px; padding: 12px 14px; font: inherit;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .send { background: var(--accent); color: #03121d; border: 0; border-radius: 12px; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer; }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 22px; width: min(92vw, 380px); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 6px; font-size: 18px; }
  dialog p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  dialog form { margin: 0; }
  .err { color: var(--danger); font-size: 13px; min-height: 1.3em; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1 id="name">Jarvis</h1>
  <div style="display:flex;gap:8px">
    <button class="pill" id="handsfree" aria-pressed="false" title="Fica ouvindo e responde quando você disser o nome dele">Mãos livres</button>
    <button class="pill" id="logout" title="Trocar token">Sair</button>
  </div>
</header>

<section class="stats" aria-label="Últimas 24 horas">
  <div class="stat"><b id="s-q">–</b><span>respondidas</span></div>
  <div class="stat"><b id="s-m">–</b><span>membros</span></div>
  <div class="stat"><b id="s-v">–</b><span>vendas</span></div>
  <div class="stat" id="s-p-box"><b id="s-p">–</b><span>pendentes</span></div>
</section>

<main>
  <button class="orb" id="orb" data-state="idle" aria-label="Falar com o Jarvis"></button>
  <div id="status">Toque para falar</div>
  <div id="heard" aria-live="polite"></div>
</main>

<div id="log" aria-live="polite"></div>
<form id="textform" autocomplete="off">
  <input type="text" id="text" placeholder="Ou escreva aqui…" enterkeyhint="send">
  <button class="send" type="submit">Enviar</button>
</form>

<dialog id="login">
  <h2>Acesso</h2>
  <p>Informe o token do seu Jarvis (variável JARVIS_TOKEN do servidor).</p>
  <form id="loginform">
    <input type="password" id="token" placeholder="Token" autocomplete="current-password" required>
    <button class="send" type="submit">Entrar</button>
  </form>
  <div class="err" id="loginerr"></div>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const orb = $('orb'), statusEl = $('status'), heardEl = $('heard'), logEl = $('log');
  const mem = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };
  let token = mem.get('jarvis_token') || '';
  let assistant = 'Jarvis';
  let state = 'idle';
  let handsFree = false;
  let lastReplyAt = 0;

  const setState = (s, label) => {
    state = s; orb.dataset.state = s;
    statusEl.textContent = label ?? ({ idle: handsFree ? `Diga "${assistant}…"` : 'Toque para falar', listening: 'Ouvindo…', thinking: 'Pensando…', speaking: 'Falando…' })[s];
  };
  const addMsg = (who, text) => {
    const d = document.createElement('div');
    d.className = 'msg ' + who; d.textContent = text;
    logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
  };

  // ---------- API ----------
  async function api(path, body) {
    const res = await fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401) { askToken('Token inválido.'); throw new Error('unauthorized'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }
  async function refresh() {
    try {
      const s = await api('/api/state');
      assistant = s.assistant || 'Jarvis';
      $('name').textContent = assistant; document.title = assistant;
      $('s-q').textContent = s.today.questionsAnswered;
      $('s-m').textContent = s.today.newMembers;
      $('s-v').textContent = s.today.sales.count;
      $('s-p').textContent = s.today.pending.length;
      $('s-p-box').classList.toggle('alert', s.today.pending.length > 0);
      if (state === 'idle') setState('idle');
    } catch {}
  }

  // ---------- Voz: fala ----------
  const synth = window.speechSynthesis;
  let voice = null;
  const pickVoice = () => {
    const vs = synth ? synth.getVoices() : [];
    voice = vs.find((v) => /pt[-_]BR/i.test(v.lang) && /male|masc|daniel|felipe|ricardo/i.test(v.name))
         || vs.find((v) => /pt[-_]BR/i.test(v.lang)) || vs.find((v) => /^pt/i.test(v.lang)) || null;
  };
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
  let unlocked = false;
  const unlock = () => { // iOS só libera a voz depois de um toque
    if (unlocked || !synth) return; unlocked = true;
    const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u);
  };
  function speak(text) {
    return new Promise((resolve) => {
      if (!synth) return resolve();
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'pt-BR'; if (voice) u.voice = voice; u.rate = 1.05; u.pitch = .9;
      u.onend = u.onerror = () => resolve();
      synth.speak(u);
    });
  }

  // ---------- Voz: escuta ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, finalText = '';
  function startListening() {
    if (!SR || listening || state === 'thinking' || state === 'speaking') return;
    rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false;
    finalText = ''; listening = true; setState('listening'); heardEl.textContent = '';
    rec.onresult = (e) => {
      let interim = ''; finalText = '';
      for (const r of e.results) (r.isFinal ? (finalText += r[0].transcript) : (interim += r[0].transcript));
      heardEl.textContent = finalText || interim;
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        handsFree = false; $('handsfree').setAttribute('aria-pressed', 'false');
        setState('idle', 'Permita o microfone para falar.');
      }
    };
    rec.onend = () => {
      listening = false;
      const said = finalText.trim();
      if (said) return onHeard(said);
      if (state === 'listening') setState('idle');
      if (handsFree) setTimeout(startListening, 350);
    };
    try { rec.start(); } catch { listening = false; setState('idle'); }
  }
  function stopListening() { try { rec && rec.stop(); } catch {} }

  function onHeard(said) {
    if (handsFree) {
      // Em mãos livres, só responde se chamarem pelo nome ou for continuação recente da conversa.
      const called = said.toLowerCase().includes(assistant.toLowerCase());
      const followUp = Date.now() - lastReplyAt < 20000;
      if (!called && !followUp) { heardEl.textContent = ''; setState('idle'); return setTimeout(startListening, 250); }
    }
    send(said, 'voice');
  }

  async function send(text, channel) {
    addMsg('me', text); heardEl.textContent = ''; setState('thinking');
    try {
      const { reply } = await api('/api/chat', { text, channel });
      addMsg('jarvis', reply);
      if (channel === 'voice') { setState('speaking'); await speak(reply); }
      lastReplyAt = Date.now();
    } catch (e) {
      if (e.message !== 'unauthorized') addMsg('jarvis', 'Sem conexão com o servidor agora.');
    }
    setState('idle'); refresh();
    if (handsFree) setTimeout(startListening, 300);
  }

  // ---------- Interface ----------
  orb.addEventListener('click', () => {
    unlock();
    if (state === 'speaking') { synth && synth.cancel(); return; }
    if (!SR) return setState('idle', 'Este navegador não tem reconhecimento de voz. Use o campo de texto.');
    listening ? stopListening() : startListening();
  });
  $('handsfree').addEventListener('click', () => {
    unlock();
    if (!SR) return setState('idle', 'Este navegador não tem reconhecimento de voz.');
    handsFree = !handsFree;
    $('handsfree').setAttribute('aria-pressed', String(handsFree));
    if (handsFree) startListening(); else { stopListening(); setState('idle'); }
  });
  $('textform').addEventListener('submit', (e) => {
    e.preventDefault();
    const t = $('text').value.trim(); if (!t || state === 'thinking') return;
    $('text').value = ''; send(t, 'text');
  });
  $('logout').addEventListener('click', () => { token = ''; mem.set('jarvis_token', null); askToken(''); });

  function askToken(err) {
    $('loginerr').textContent = err || '';
    if (!$('login').open) $('login').showModal();
  }
  $('loginform').addEventListener('submit', async (e) => {
    e.preventDefault();
    token = $('token').value.trim();
    try {
      const res = await fetch('/api/state', { headers: { Authorization: 'Bearer ' + token } });
      if (!res.ok) throw new Error();
      mem.set('jarvis_token', token); $('token').value = ''; $('login').close(); refresh();
    } catch { $('loginerr').textContent = 'Token inválido.'; }
  });
  $('login').addEventListener('cancel', (e) => e.preventDefault());

  if (token) refresh(); else askToken('');
  setInterval(() => token && document.visibilityState === 'visible' && refresh(), 60000);
})();
</script>
</body>
</html>
