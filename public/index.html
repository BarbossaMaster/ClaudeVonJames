<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Jarvis</title>
<style>
  :root {
    --bg: #000; --text: #f2f4f3; --muted: #6f7773; --faint: #2a2f2c; --line: #161a18;
    --green: #E3C173; --purple: #FFF1CF; /* dourado e branco quente da marca */ --danger: #ff4d5e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; min-height: 100dvh;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--green); outline-offset: 4px; border-radius: 4px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 14px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
  .brand h1 { font-size: 13px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; margin: 0; }
  .actions { display: flex; align-items: center; gap: 18px; font-size: 13px; color: var(--muted); }
  .toggle { display: flex; align-items: center; gap: 8px; }
  .toggle .sw { width: 30px; height: 16px; border-radius: 99px; background: var(--faint); position: relative; transition: background .2s; }
  .toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
  .toggle[aria-pressed="true"] { color: var(--text); }
  .toggle[aria-pressed="true"] .sw { background: color-mix(in srgb, var(--green) 30%, #000); }
  .toggle[aria-pressed="true"] .sw::after { transform: translateX(14px); background: var(--green); box-shadow: 0 0 8px var(--green); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat { padding: 14px 0 12px; text-align: center; min-width: 0; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat b { display: block; font-size: 22px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stat span { display: block; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .stat.alert b { color: var(--purple); text-shadow: 0 0 14px color-mix(in srgb, var(--purple) 70%, transparent); }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 300px; }
  .core { width: min(78vw, 320px); aspect-ratio: 1; border-radius: 50%; padding: 0; display: block; }
  .core canvas { width: 100%; height: 100%; display: block; }
  #status { color: var(--muted); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; min-height: 1.4em; text-align: center; }

  #log { width: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; max-height: 30dvh; overflow-y: auto; padding: 4px 0 8px; scrollbar-width: none; }
  #log::-webkit-scrollbar { display: none; }
  .msg { max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
  .msg.jarvis { align-self: flex-start; padding-left: 12px; border-left: 1px solid var(--green); }
  .msg.me { align-self: flex-end; color: var(--muted); text-align: right; max-width: 85%; }
  .stage { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .talk { display: flex; flex-direction: column; }

  .doc { align-self: flex-start; display: flex; align-items: stretch; max-width: 92%; border: 1px solid var(--faint); border-radius: 10px; font-size: 14px; overflow: hidden; }
  .doc a { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; padding: 11px 14px; color: var(--text); text-decoration: none; }
  .doc svg { width: 16px; height: 16px; flex: none; color: var(--green); }
  .doc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc small { color: var(--muted); flex: none; }
  .doc .share { flex: none; width: 46px; display: grid; place-items: center; border-left: 1px solid var(--faint); }
  #doclist { display: flex; flex-direction: column; gap: 8px; max-height: 50dvh; overflow-y: auto; }
  #doclist .doc { max-width: 100%; align-self: stretch; }
  .close { margin-top: 16px; color: var(--muted); font-size: 13px; }

  #dbg { font: 10px/1.35 ui-monospace, Menlo, monospace; color: var(--muted); margin: 0 0 8px; white-space: pre-wrap; }

  form.bar { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 620px; margin: 6px auto 16px; border-bottom: 1px solid var(--faint); transition: border-color .2s; }
  form.bar:focus-within { border-color: var(--green); }
  input[type=text], input[type=password] {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text);
    padding: 12px 0; font: inherit;
  }
  input::placeholder { color: var(--muted); }
  .send { width: 36px; height: 36px; display: grid; place-items: center; color: var(--green); flex: none; }
  .send svg { width: 18px; height: 18px; }

  dialog { background: #060807; color: var(--text); border: 1px solid var(--faint); border-radius: 14px; padding: 26px 24px 20px; width: min(90vw, 360px); }
  dialog::backdrop { background: rgba(0,0,0,.8); }
  dialog h2 { margin: 0 0 6px; font-size: 13px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; }
  dialog p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  dialog form.bar { margin: 0; }
  .err { color: var(--danger); font-size: 13px; min-height: 1.3em; margin-top: 10px; }

  /* Mouse: retorno visual ao passar por cima. */
  @media (hover: hover) {
    .actions button:hover, .close:hover { color: var(--text); }
    .doc:hover { border-color: var(--muted); }
    .send:hover { filter: drop-shadow(0 0 6px var(--green)); }
    .core:hover canvas { filter: brightness(1.15); }
  }

  /* Computador: o anel fica à esquerda e a conversa, com histórico, numa coluna à direita. */
  @media (min-width: 900px) {
    body { height: 100dvh; overflow: hidden; padding-left: max(32px, calc((100vw - 1280px) / 2)); padding-right: max(32px, calc((100vw - 1280px) / 2)); }
    header { padding: 24px 0 18px; }
    .brand h1 { font-size: 14px; }
    .actions { gap: 26px; font-size: 14px; }
    .stat { padding: 18px 0 16px; }
    .stat b { font-size: 30px; }
    .stat span { font-size: 11px; margin-top: 4px; }
    .stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 460px); }
    main { min-height: 0; gap: 14px; }
    .core { width: min(46vh, 34vw, 440px); }
    #status { font-size: 13px; }
    .talk { min-height: 0; border-left: 1px solid var(--line); padding: 24px 0 0 36px; }
    #log { flex: 1; max-width: none; max-height: none; margin: 0; padding: 0 12px 16px 0; gap: 18px; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
    #log::-webkit-scrollbar { display: block; width: 6px; }
    #log::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 3px; }
    #log:empty::before { content: "Aperte espaço para falar ou escreva abaixo. Esc interrompe a fala."; color: var(--muted); font-size: 14px; margin: auto 0; }
    #log > :first-child { margin-top: auto; }
    form.bar { max-width: none; margin: 0 0 28px; }
    dialog { width: min(90vw, 440px); }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><i></i><h1 id="name">Jarvis</h1></div>
  <div class="actions">
    <button class="toggle" id="handsfree" aria-pressed="false" title="Fica ouvindo e responde quando você disser o nome dele"><span class="sw"></span>Mãos livres</button>
    <button id="docsbtn" title="Documentos gerados">Docs</button>
    <button id="logout" title="Trocar token">Sair</button>
  </div>
</header>

<section class="stats" aria-label="Últimas 24 horas">
  <div class="stat"><b id="s-q">–</b><span>Respondidas</span></div>
  <div class="stat"><b id="s-m">–</b><span>Membros</span></div>
  <div class="stat"><b id="s-v">–</b><span>Vendas</span></div>
  <div class="stat" id="s-p-box"><b id="s-p">–</b><span>Pendentes</span></div>
</section>

<div class="stage">
<main>
  <button class="core" id="orb" data-state="idle" aria-label="Falar com o Jarvis"><canvas id="viz"></canvas></button>
  <div id="status">Toque para falar</div>
</main>

<section class="talk" aria-label="Conversa">
<pre id="dbg" hidden></pre>
<div id="log" aria-live="polite"></div>
<form id="textform" class="bar" autocomplete="off">
  <input type="text" id="text" placeholder="Escreva aqui" enterkeyhint="send" aria-label="Mensagem">
  <button class="send" type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</form>
</section>
</div>

<dialog id="docs">
  <h2>Documentos</h2>
  <p id="docsempty">Nenhum documento ainda. Peça um PDF ao assistente.</p>
  <div id="doclist"></div>
  <button class="close" id="docsclose">Fechar</button>
</dialog>

<dialog id="login">
  <h2>Acesso</h2>
  <p>Informe o token do seu Jarvis.</p>
  <form id="loginform" class="bar">
    <input type="password" id="token" placeholder="Token" autocomplete="current-password" required aria-label="Token">
    <button class="send" type="submit" aria-label="Entrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
  <div class="err" id="loginerr"></div>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const orb = $('orb'), statusEl = $('status'), logEl = $('log');
  const mem = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };
  // Diagnóstico: abrir o endereço com #debug no final mostra os eventos de voz na tela.
  const debugOn = location.hash.includes('debug');
  const t0 = Date.now();
  function dbg(msg) {
    if (!debugOn) return;
    const el = $('dbg'); el.hidden = false;
    el.textContent = (el.textContent + `\n${((Date.now() - t0) / 1000).toFixed(1)} ${msg}`).split('\n').slice(-14).join('\n');
  }
  let token = mem.get('jarvis_token') || '';
  let assistant = 'Jarvis';
  let state = 'idle';
  let handsFree = false;
  let lastReplyAt = 0;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  const setState = (s, label) => {
    state = s; orb.dataset.state = s;
    statusEl.textContent = label ?? ({ idle: handsFree ? `Diga "${assistant}"` : !SR ? 'Escreva sua mensagem' : desk.matches ? 'Clique ou aperte espaço' : 'Toque para falar', listening: 'Ouvindo', thinking: 'Pensando', speaking: 'Falando' })[s];
  };
  // No celular a tela mostra só a última resposta do assistente (e os PDFs dela).
  // No computador há espaço: a conversa inteira fica na coluna da direita, com as falas do usuário.
  const wide = matchMedia('(min-width: 900px)');
  const desk = matchMedia('(hover: hover) and (pointer: fine)');
  const bubble = (cls, text) => {
    const d = document.createElement('div');
    d.className = 'msg ' + cls; d.textContent = text;
    return d;
  };
  function showAsked(text) {
    if (!wide.matches) return;
    logEl.append(bubble('me', text));
    logEl.scrollTop = logEl.scrollHeight;
  }
  function showReply(text, documents = []) {
    const d = bubble('jarvis', text), docs = documents.map((x) => docLink(x));
    if (wide.matches) {
      logEl.append(d, ...docs);
      while (logEl.childElementCount > 200) logEl.firstElementChild.remove();
      return d.scrollIntoView({ block: 'nearest' });
    }
    logEl.replaceChildren(d, ...docs);
    logEl.scrollTop = 0;
  }
  const DOC_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
  const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  const canShareFiles = (() => {
    try { return !!navigator.canShare && navigator.canShare({ files: [new File([''], 'a.pdf', { type: 'application/pdf' })] }); } catch { return false; }
  })();
  function docLink(d, withDate) {
    const box = document.createElement('div');
    box.className = 'doc';
    const a = document.createElement('a');
    a.href = d.url; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = DOC_ICON;
    const s = document.createElement('span'); s.textContent = d.title; a.appendChild(s);
    const m = document.createElement('small');
    m.textContent = withDate && d.ts ? new Date(d.ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) : 'PDF';
    a.appendChild(m);
    box.appendChild(a);
    if (canShareFiles) {
      // O arquivo é baixado já na criação do item: o iPhone só abre a folha de compartilhar
      // se ela for chamada no instante do toque, sem espera no meio.
      const name = d.title.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) + '.pdf';
      const file = fetch(d.url).then((r) => (r.ok ? r.blob() : Promise.reject())).then((blob) => new File([blob], name, { type: 'application/pdf' }));
      let ready = null; file.then((f) => (ready = f), () => {});
      const btn = document.createElement('button');
      btn.className = 'share'; btn.setAttribute('aria-label', 'Salvar ou enviar ' + d.title); btn.innerHTML = SHARE_ICON;
      btn.addEventListener('click', () => {
        if (!ready) return window.open(d.url, '_blank');
        navigator.share({ files: [ready], title: d.title }).catch(() => {});
      });
      box.appendChild(btn);
    }
    return box;
  }

  // ---------- Núcleo visual: esfera holográfica de partículas que reage ao estado ----------
  // Camadas concêntricas de pontos e traços giram em sentidos opostos, cercadas por arcos orbitais.
  // Parado ele respira; ouvindo acende; pensando as camadas giram e clareiam; falando pulsa no volume real da voz.
  const viz = $('viz'), g = viz.getContext('2d');
  const GOLD = [227, 188, 105], WHITE = [255, 245, 222];
  // alvo por estado: giro, energia (quanto a fala move a esfera), branco, brilho, núcleo, agitação
  const TARGET = {
    idle:      { spin: .045, energy: 0,   white: 0,   glow: .60, core: .40, churn: .06 },
    listening: { spin: .06,  energy: 0,   white: .12, glow: .95, core: .70, churn: .05 },
    thinking:  { spin: .20,  energy: 0,   white: .50, glow: .90, core: 1.0, churn: .36 },
    speaking:  { spin: .07,  energy: .24, white: .18, glow: 1.0, core: .90, churn: .10 },
  };
  const cur = { ...TARGET.idle };
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let rnd = 7; const rand = () => (rnd = (rnd * 16807) % 2147483647) / 2147483647; // sempre o mesmo desenho

  // Três cascas: a de fora mais densa, as de dentro girando ao contrário.
  const SHELLS = [{ r: 1, dir: 1 }, { r: .76, dir: -1.6 }, { r: .52, dir: 2.4 }];
  const pts = [];
  [560, 280, 150].forEach((n, shell) => {
    for (let i = 0; i < n; i++) {
      const y = 1 - (2 * (i + .5)) / n, phi = i * 2.399963 + shell;
      pts.push({
        shell, y, phi, rad: Math.sqrt(1 - y * y),
        jit: 1 + (rand() - .5) * .07, seed: rand() * 6.283,
        streak: rand() < .42 ? .05 + rand() * .26 : 0, // traço ao longo da latitude, como um fragmento de dado
        alt: rand() < .3,                               // parte dos pontos usa a cor secundária
        size: .6 + rand() * 1.1,
      });
    }
  });
  // Arcos orbitais: anéis incompletos em inclinações diferentes.
  const arcs = Array.from({ length: 7 }, (_, i) => ({
    tiltX: (rand() - .5) * 2.2, tiltZ: (rand() - .5) * 2.2, r: 1.05 + rand() * .14,
    speed: (rand() < .5 ? -1 : 1) * (.25 + rand() * .7), alt: i % 3 === 1,
    segs: Array.from({ length: 2 + Math.floor(rand() * 3) }, () => [rand() * 6.283, .35 + rand() * 1.3]),
  }));

  let W = 0, H = 0, T = 0, lastT = 0, rotY = 0, shellRot = [0, 0, 0], arcRot = arcs.map(() => 0), mouth = 0, spiralRot = 0;
  function fit() {
    const r = viz.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    viz.width = W = Math.round(r.width * d); viz.height = H = Math.round(r.height * d);
  }
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));

  // Ponto da esfera (latitude y, longitude phi, raio r) -> tela, com inclinação e perspectiva.
  const TILT = .42, cosT = Math.cos(TILT), sinT = Math.sin(TILT);
  function project(x, y, z, R, cx, cy) {
    const y2 = y * cosT - z * sinT, z2 = y * sinT + z * cosT;
    const k = 3.2 / (3.2 - z2);
    return [cx + x * R * k, cy + y2 * R * k, z2];
  }

  function draw(t) {
    const dt = Math.min(.05, (t - lastT) / 1000 || 0); lastT = t;
    const tg = TARGET[orb.dataset.state] || TARGET.idle, ease = still ? 1 : Math.min(1, dt * 4);
    for (const k in cur) cur[k] += (tg[k] - cur[k]) * ease;
    T += dt;
    rotY += dt * cur.spin;
    SHELLS.forEach((sh, i) => (shellRot[i] += dt * sh.dir * (.025 + cur.churn * .7)));
    arcs.forEach((a, i) => (arcRot[i] += dt * a.speed * (.22 + cur.churn * 1.2)));
    spiralRot += dt * (.25 + cur.churn * 2.2);
    // Boca: segue o volume real do áudio que está tocando. Sem esse dado (voz do aparelho),
    // usa um ritmo simulado de sílabas. Sobe rápido e desce devagar, como uma voz.
    let level = 0;
    if (orb.dataset.state === 'speaking') {
      const real = speechLevel();
      level = real ?? Math.abs(Math.sin(T * 6.1)) * .5 + Math.abs(Math.sin(T * 3.7 + 1)) * .3 + Math.abs(Math.sin(T * 9.3 + 2)) * .2;
    }
    mouth += (level - mouth) * Math.min(1, dt * (level > mouth ? 24 : 8));
    const pulse = cur.energy * mouth;
    const breath = Math.sin(T * .9) * .012; // respiração lenta, sempre presente

    const cx = W / 2, cy = H / 2, R = Math.min(W, H) * .285, u = W / 320;
    g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    const main = mix(GOLD, WHITE, cur.white), second = mix(WHITE, GOLD, .22);

    // brilho de fundo e núcleo
    const halo = g.createRadialGradient(cx, cy, 0, cx, cy, R * 1.7);
    halo.addColorStop(0, rgba(main, (.16 + pulse * .5) * cur.glow));
    halo.addColorStop(.45, rgba(main, .05 * cur.glow));
    halo.addColorStop(1, rgba(main, 0));
    g.fillStyle = halo; g.fillRect(0, 0, W, H);
    const cr = R * (.16 + cur.core * .1 + pulse * .5);
    const core = g.createRadialGradient(cx, cy, 0, cx, cy, cr);
    core.addColorStop(0, rgba([255, 251, 240], .8 * cur.core * cur.glow));
    core.addColorStop(.35, rgba(second, .45 * cur.core * cur.glow));
    core.addColorStop(1, rgba(second, 0));
    g.fillStyle = core; g.fillRect(cx - cr, cy - cr, cr * 2, cr * 2);

    // grade tênue da esfera: paralelos e meridianos dão volume
    g.beginPath();
    const gridRot = rotY + shellRot[0];
    for (let k = -2; k <= 2; k++) {
      const gy = k * .36, gr = Math.sqrt(1 - gy * gy);
      for (let j = 0; j <= 48; j++) {
        const th = (j / 48) * 6.2832;
        const [px, py] = project(Math.cos(th) * gr, gy, Math.sin(th) * gr, R, cx, cy);
        j ? g.lineTo(px, py) : g.moveTo(px, py);
      }
    }
    for (let k = 0; k < 6; k++) {
      const ph = gridRot + (k / 6) * 3.1416;
      for (let j = 0; j <= 48; j++) {
        const th = (j / 48) * 6.2832, rr = Math.sin(th);
        const [px, py] = project(Math.cos(ph) * rr, Math.cos(th), Math.sin(ph) * rr, R, cx, cy);
        j ? g.lineTo(px, py) : g.moveTo(px, py);
      }
    }
    g.strokeStyle = rgba(main, .09 * cur.glow); g.lineWidth = .7 * u; g.stroke();

    // espiral do núcleo: dois braços que giram, mais rápido quando ele pensa
    const spin = spiralRot;
    for (let arm = 0; arm < 2; arm++) {
      g.beginPath();
      for (let j = 0; j <= 40; j++) {
        const f = j / 40, th = spin + arm * 3.1416 + f * 5.2, rr = f * (.36 + pulse * .9);
        const [px, py] = project(Math.cos(th) * rr, (f - .5) * .12, Math.sin(th) * rr, R, cx, cy);
        j ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.strokeStyle = rgba(arm ? main : second, .5 * cur.core * cur.glow); g.lineWidth = 1.3 * u; g.stroke();
    }

    // partículas e traços, agrupados por cor e profundidade para desenhar rápido
    const dots = {}, lines = {};
    for (const p of pts) {
      const sh = SHELLS[p.shell];
      const wob = Math.sin(p.seed + T * 1.1) * (.008 + cur.churn * .05);
      const wave = Math.sin(p.y * 4 - T * 2.6 + p.shell) * pulse * .42;
      const r = sh.r * p.jit * (1 + breath + wob + wave + pulse * .3);
      const phi = p.phi + rotY + shellRot[p.shell];
      const [x, y, z] = project(Math.cos(phi) * p.rad * r, p.y * r, Math.sin(phi) * p.rad * r, R, cx, cy);
      const depth = (z / sh.r + 1) / 2;                       // 0 atrás, 1 na frente
      const a = Math.min(3, Math.floor(depth * 4));
      const key = (p.alt ? 's' : 'm') + a;
      if (p.streak) {
        const phi2 = phi + p.streak * (1 + pulse * 2);
        const [x2, y2] = project(Math.cos(phi2) * p.rad * r, p.y * r, Math.sin(phi2) * p.rad * r, R, cx, cy);
        (lines[key] ||= []).push(x, y, x2, y2);
      } else {
        const sz = p.size * u * (.7 + depth * .9);
        (dots[key] ||= []).push(x - sz / 2, y - sz / 2, sz);
      }
    }
    const alphaOf = (key) => (.2 + .27 * Number(key[1])) * cur.glow;
    for (const key in dots) {
      g.fillStyle = rgba(key[0] === 's' ? second : main, alphaOf(key));
      g.beginPath();
      const d = dots[key];
      for (let i = 0; i < d.length; i += 3) g.rect(d[i], d[i + 1], d[i + 2], d[i + 2]);
      g.fill();
    }
    g.lineCap = 'round';
    for (const key in lines) {
      g.strokeStyle = rgba(key[0] === 's' ? second : main, alphaOf(key) * .9);
      g.lineWidth = (.7 + Number(key[1]) * .22) * u;
      g.beginPath();
      const d = lines[key];
      for (let i = 0; i < d.length; i += 4) { g.moveTo(d[i], d[i + 1]); g.lineTo(d[i + 2], d[i + 3]); }
      g.stroke();
    }

    // arcos orbitais: um traço largo e fraco por baixo dá o brilho, um fino por cima dá a nitidez
    arcs.forEach((a, i) => {
      const cxr = Math.cos(a.tiltX), sxr = Math.sin(a.tiltX), czr = Math.cos(a.tiltZ), szr = Math.sin(a.tiltZ);
      const col = a.alt ? second : main, rr = a.r * (1 + pulse * .3);
      g.beginPath();
      for (const [start, len] of a.segs) {
        for (let j = 0; j <= 26; j++) {
          const th = start + arcRot[i] + (len * j) / 26;
          let x = Math.cos(th) * rr, y = 0, z = Math.sin(th) * rr;
          const y1 = y * cxr - z * sxr, z1 = y * sxr + z * cxr;          // inclina em X
          const x2 = x * czr - y1 * szr, y2 = x * szr + y1 * czr;        // inclina em Z
          const xr = x2 * Math.cos(rotY * .5) - z1 * Math.sin(rotY * .5), zr = x2 * Math.sin(rotY * .5) + z1 * Math.cos(rotY * .5);
          const [px, py] = project(xr, y2, zr, R, cx, cy);
          j ? g.lineTo(px, py) : g.moveTo(px, py);
        }
      }
      g.strokeStyle = rgba(col, .10 * cur.glow); g.lineWidth = 5 * u; g.stroke();
      g.strokeStyle = rgba(col, .62 * cur.glow); g.lineWidth = 1.1 * u; g.stroke();
    });

    g.globalCompositeOperation = 'source-over';
    if (!still) requestAnimationFrame(draw);
  }
  fit(); addEventListener('resize', () => { fit(); if (still) draw(0); });
  requestAnimationFrame(draw);
  if (still) new MutationObserver(() => draw(0)).observe(orb, { attributes: true });

  // ---------- API ----------
  async function api(path, body) {
    const res = await fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401) { askToken('Token inválido.'); throw new Error('unauthorized'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }
  async function refresh() {
    try {
      const s = await api('/api/state');
      assistant = s.assistant || 'Jarvis'; serverVoice = Boolean(s.voice); voiceRate = Number(s.voiceRate) || 1;
      $('name').textContent = assistant; document.title = assistant;
      orb.setAttribute('aria-label', 'Falar com o ' + assistant);
      $('s-q').textContent = s.today.questionsAnswered;
      $('s-m').textContent = s.today.newMembers;
      $('s-v').textContent = s.today.sales.count;
      $('s-p').textContent = s.today.pending.length;
      $('s-p-box').classList.toggle('alert', s.today.pending.length > 0);
      if (state === 'idle') setState('idle');
    } catch {}
  }

  // ---------- Voz: fala ----------
  const synth = window.speechSynthesis;
  let voice = null;
  const pickVoice = () => {
    // Prefere as vozes "Premium/Aprimorada" baixadas nos Ajustes do aparelho: soam bem menos robóticas.
    const pt = (synth ? synth.getVoices() : []).filter((v) => /^pt/i.test(v.lang));
    const score = (v) =>
      (/pt[-_]BR/i.test(v.lang) ? 4 : 0) + (/premium/i.test(v.name) ? 3 : /enhanced|aprimorad|natural/i.test(v.name) ? 2 : 0) +
      (/felipe|daniel|ricardo|antonio|male|masc/i.test(v.name) ? 1 : 0);
    voice = pt.sort((x, y) => score(y) - score(x))[0] || null;
  };
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
  let unlocked = false;
  const unlock = () => { // iOS só libera a voz depois de um toque
    if (unlocked || !synth) return; unlocked = true;
    const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u);
  };
  const unlockAll = () => { unlock(); unlockPlayer(); };
  // Voz natural vinda do servidor. Um único elemento de áudio, liberado no primeiro toque,
  // porque o iPhone só deixa tocar som que começou num gesto do usuário.
  const player = new Audio();
  let serverVoice = false, playerUnlocked = false, voiceRate = 1;
  const SILENCE = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
  function unlockPlayer() {
    if (playerUnlocked) return; playerUnlocked = true;
    player.src = SILENCE; player.play().catch(() => {});
  }
  // A fala sempre termina por um destes caminhos: o áudio acabou, o tempo máximo estourou
  // ou o usuário interrompeu. Sem isso, um evento perdido no iPhone travava o app em "Falando".
  let endSpeech = null, lastUrl = null;
  // Volume da fala ao longo do tempo, calculado do próprio áudio antes de tocar. O áudio continua
  // tocando pelo player normal; isto só lê os dados para a esfera se mexer junto com a voz.
  let speechEnv = null, decodeCtx = null;
  function speechLevel() {
    if (!speechEnv || player.paused || !(player.currentTime > 0)) return null;
    return speechEnv.data[Math.floor(player.currentTime / speechEnv.step)] ?? 0;
  }
  function envelopeOf(buffer) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return Promise.reject(new Error('sem AudioContext'));
    decodeCtx ||= new AC();
    return new Promise((res, rej) => decodeCtx.decodeAudioData(buffer, res, rej)).then((audio) => {
      const ch = audio.getChannelData(0), step = .04, n = Math.max(1, Math.floor(audio.sampleRate * step));
      const data = new Float32Array(Math.ceil(ch.length / n));
      let peak = 1e-6;
      for (let i = 0; i < data.length; i++) {
        let sum = 0; const end = Math.min(ch.length, (i + 1) * n);
        for (let k = i * n; k < end; k += 4) sum += ch[k] * ch[k];
        data[i] = Math.sqrt(sum / Math.max(1, (end - i * n) / 4));
        if (data[i] > peak) peak = data[i];
      }
      for (let i = 0; i < data.length; i++) data[i] = Math.min(1, Math.pow(data[i] / peak, .7));
      return { data, step };
    });
  }
  function speak(text) {
    return new Promise((resolve) => {
      let done = false, timer = null;
      const finish = (why = 'evento') => {
        if (done) return; done = true;
        clearTimeout(timer); endSpeech = null; speechEnv = null;
        player.onended = player.onerror = player.onloadedmetadata = null;
        // Devolve o áudio do aparelho: no iPhone, um player ainda "ativo" deixa o microfone surdo na escuta seguinte.
        try { player.pause(); player.removeAttribute('src'); player.load(); } catch {}
        dbg('fala: fim (' + why + ')');
        resolve();
      };
      const guard = (ms) => { clearTimeout(timer); timer = setTimeout(() => finish('tempo'), ms); };
      endSpeech = () => finish('interrompida');
      guard(15000 + text.length * 90);

      const browser = () => {
        if (done) return;
        if (!synth) return finish();
        synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'pt-BR'; if (voice) u.voice = voice; u.rate = 1.05; u.pitch = .9;
        u.onend = u.onerror = () => finish('voz do aparelho');
        dbg('fala: voz do aparelho');
        synth.speak(u);
        guard(4000 + text.length * 95);
      };
      if (!serverVoice) return browser();

      fetch('/api/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ text }),
      })
        .then((res) => (res.ok ? res.blob() : Promise.reject(new Error('HTTP ' + res.status))))
        .then((blob) => {
          if (done) return;
          if (lastUrl) URL.revokeObjectURL(lastUrl);
          lastUrl = URL.createObjectURL(blob);
          blob.arrayBuffer().then(envelopeOf).then((env) => { if (!done) speechEnv = env; dbg('fala: volume real ok'); }, () => dbg('fala: sem volume real'));
          player.onended = () => finish('áudio terminou');
          player.onerror = () => { dbg('fala: erro no player'); browser(); };
          dbg('fala: tocando áudio');
          player.onloadedmetadata = () => {
            if (Number.isFinite(player.duration)) guard((player.duration / voiceRate) * 1000 + 2500);
          };
          player.src = lastUrl; player.defaultPlaybackRate = voiceRate; player.playbackRate = voiceRate;
          return player.play();
        })
        .catch((e) => { dbg('fala: falhou ' + (e && e.name || e)); browser(); }); // sem voz do servidor, usa a do aparelho
    });
  }
  function stopSpeaking() {
    try { synth && synth.cancel(); } catch {}
    try { player.pause(); } catch {}
    if (endSpeech) endSpeech();
  }

  // ---------- Voz: escuta ----------
  let rec = null, listening = false, retries = 0;
  const SILENCE_MS = 3000;      // pausa que encerra uma fala curta
  const LONG_SILENCE_MS = 4000; // em fala longa, espera mais (dá tempo de pensar)
  const NO_SPEECH_MS = 8000; // desiste se ninguém falar
  function startListening() {
    if (!SR || listening || state === 'thinking' || state === 'speaking') return;
    // Encerra de vez qualquer sessão anterior, para ela não disparar eventos atrasados.
    if (rec) { rec.onresult = rec.onerror = rec.onend = null; try { rec.abort(); } catch {} }
    const r = (rec = new SR());
    r.lang = 'pt-BR'; r.interimResults = true; r.continuous = false;
    listening = true; setState('listening');
    let results = 0;
    let heard = '', done = false, failed = '', silenceTimer = null, endTimer = null;
    const finish = () => {
      if (done) return; done = true;
      clearTimeout(silenceTimer); clearTimeout(endTimer);
      r.onresult = r.onerror = r.onend = null;
      dbg(`escuta: fim, ${results} resultados, "${heard.slice(0, 24)}"${failed ? ', erro ' + failed : ''}`);
      if (rec !== r) return; // já existe outra sessão no lugar desta
      listening = false;
      const said = heard.trim();
      if (said) { retries = 0; return onHeard(said); }
      if (state === 'listening') setState('idle');
      // O iPhone às vezes recusa o microfone logo depois de tocar áudio; tenta de novo sozinho.
      if (/aborted|audio-capture|network/.test(failed) && retries < 2) { retries++; return setTimeout(startListening, 450); }
      retries = 0;
      if (handsFree) setTimeout(startListening, 350);
    };
    // Quem decide que a fala acabou é o silêncio, e a sessão é derrubada na hora com abort().
    // Com stop(), o iPhone mantinha o microfone aberto por vários segundos (ouvindo até a resposta
    // do próprio assistente), e a escuta seguinte só funcionava depois que essa sessão antiga morria.
    const stopSoon = (ms) => {
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => {
        try { r.abort(); } catch {}
        finish();
      }, ms);
    };
    r.stopNow = () => stopSoon(0);
    let committed = '', current = '';
    r.onresult = (e) => {
      let text = '';
      for (const res of e.results) text += res[0].transcript;
      results++;
      text = text.trim();
      if (text) { // resultado vazio (o iPhone manda às vezes no final) não apaga o que já foi ouvido
        // Em falas longas o iPhone recomeça a transcrição do zero depois de uma pausa.
        // Quando isso acontece, guarda o trecho anterior em vez de trocar pelo novo.
        const restarted =
          current.length > 12 && text.length < current.length * 0.6 &&
          !current.toLowerCase().startsWith(text.toLowerCase().slice(0, 8));
        if (restarted) { committed = (committed + ' ' + current).trim(); dbg('escuta: novo trecho'); }
        current = text;
        heard = (committed + ' ' + current).trim();
      }
      // Fala longa ganha uma pausa maior antes de ser dada como encerrada.
      stopSoon(heard.split(/\s+/).length > 8 ? LONG_SILENCE_MS : SILENCE_MS);
    };
    r.onerror = (e) => {
      failed = e.error || 'erro'; dbg('escuta: erro ' + failed);
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        handsFree = false; $('handsfree').setAttribute('aria-pressed', 'false');
        heard = ''; finish(); setState('idle', 'Permita o microfone');
      }
    };
    r.onend = finish;
    r.onaudiostart = () => dbg('escuta: microfone abriu');
    r.onspeechstart = () => dbg('escuta: detectou voz');
    dbg('escuta: iniciando');
    try { r.start(); stopSoon(NO_SPEECH_MS); } catch { failed = 'aborted'; finish(); }
  }
  function stopListening() { if (rec && rec.stopNow) rec.stopNow(); }

  function onHeard(said) {
    if (handsFree) {
      // Em mãos livres, só responde se chamarem pelo nome ou for continuação recente da conversa.
      const called = said.toLowerCase().includes(assistant.toLowerCase());
      const followUp = Date.now() - lastReplyAt < 20000;
      if (!called && !followUp) { setState('idle'); return setTimeout(startListening, 250); }
    }
    send(said, 'voice');
  }

  async function send(text, channel) {
    showAsked(text);
    setState('thinking');
    try {
      const { reply, documents = [] } = await api('/api/chat', { text, channel });
      showReply(reply, documents);
      if (channel === 'voice') { setState('speaking'); await speak(reply); }
      lastReplyAt = Date.now();
    } catch (e) {
      if (e.message !== 'unauthorized') showReply('Sem conexão com o servidor agora.');
    }
    // Se o usuário interrompeu a fala e já está falando de novo, não mexe no estado.
    if (state === 'thinking' || state === 'speaking') setState('idle');
    refresh();
    if (handsFree && !listening) setTimeout(startListening, 300);
  }

  // ---------- Interface ----------
  const NO_VOICE = 'Sem escuta neste navegador. Use Chrome, Edge ou Safari';
  orb.addEventListener('click', () => {
    unlockAll();
    if (!SR) { $('text').focus(); return setState('idle', NO_VOICE); }
    if (state === 'thinking') return;
    // Tocar enquanto ele fala interrompe e já começa a ouvir.
    if (state === 'speaking') { stopSpeaking(); setState('idle'); retries = 0; return startListening(); }
    if (listening) return stopListening();
    retries = 0; startListening();
  });
  $('handsfree').addEventListener('click', () => {
    unlockAll();
    if (!SR) return setState('idle', NO_VOICE);
    handsFree = !handsFree;
    $('handsfree').setAttribute('aria-pressed', String(handsFree));
    if (handsFree) startListening(); else { stopListening(); setState('idle'); }
  });
  $('textform').addEventListener('submit', (e) => {
    e.preventDefault();
    const t = $('text').value.trim(); if (!t || state === 'thinking') return;
    $('text').value = ''; send(t, 'text');
  });
  // Teclado: espaço fala/para (como tocar no anel), Esc interrompe a fala,
  // e começar a digitar em qualquer lugar leva o texto para o campo de mensagem.
  addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector('dialog[open]')) return;
    const el = document.activeElement;
    const typing = el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
    if (e.key === 'Escape') {
      if (state === 'speaking') { stopSpeaking(); setState('idle'); }
      else if (listening) stopListening();
      else if (typing) el.blur();
      return;
    }
    // Com um botão ou link em foco, espaço e Enter já têm a função deles.
    if (typing || (el && /^(BUTTON|A)$/.test(el.tagName))) return;
    if (e.code === 'Space') {
      e.preventDefault(); // não rola a página
      if (!e.repeat) orb.click();
    } else if (e.key.length === 1) $('text').focus();
  });
  wide.addEventListener('change', () => { if (state === 'idle') setState('idle'); });
  desk.addEventListener('change', () => { if (state === 'idle') setState('idle'); });
  $('docsbtn').addEventListener('click', async () => {
    $('docs').showModal();
    try {
      const { documents } = await api('/api/docs');
      $('docsempty').hidden = documents.length > 0;
      $('doclist').replaceChildren(...documents.map((d) => docLink(d, true)));
    } catch {}
  });
  $('docsclose').addEventListener('click', () => $('docs').close());
  $('logout').addEventListener('click', () => { token = ''; mem.set('jarvis_token', null); askToken(''); });

  function askToken(err) {
    $('loginerr').textContent = err || '';
    if (!$('login').open) $('login').showModal();
  }
  $('loginform').addEventListener('submit', async (e) => {
    e.preventDefault();
    token = $('token').value.trim();
    try {
      const res = await fetch('/api/state', { headers: { Authorization: 'Bearer ' + token } });
      if (!res.ok) throw new Error();
      mem.set('jarvis_token', token); $('token').value = ''; $('login').close(); refresh();
    } catch { $('loginerr').textContent = 'Token inválido.'; }
  });
  $('login').addEventListener('cancel', (e) => e.preventDefault());

  setState('idle');
  if (token) refresh(); else askToken('');
  setInterval(() => token && document.visibilityState === 'visible' && refresh(), 60000);
})();
</script>
</body>
</html>
